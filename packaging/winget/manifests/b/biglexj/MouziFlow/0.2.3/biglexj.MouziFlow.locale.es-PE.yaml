Description: |-
  MouziFlow es un organizador automático y visor de descargas para Windows: mueve,
  clasifica y renombra los archivos según reglas y filtros definidos por el
  usuario, con notificaciones y control desde la bandeja del sistema.
  El instalador oficial se compila con Inno Setup 6 e instala por usuario, sin
  pedir privilegios de administrador.
